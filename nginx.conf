# CYBERTRIP.UZ — Production Nginx Configuration
# Joylashuv: /etc/nginx/sites-available/cybertrip.uz

server {
    listen 80;
    listen [::]:80;
    server_name cybertrip.uz www.cybertrip.uz;

    # HTTP dan HTTPS ga avtomatik yo'naltirish
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cybertrip.uz www.cybertrip.uz;

    # Root katalog
    root /var/www/cybertrip-uz;
    index index.html;

    # SSL Sertifikatlari (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/cybertrip.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cybertrip.uz/privkey.pem;

    # Xavfsizlik Headerlari (Cybersecurity standartlari bo'yicha)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Iframe lab muhitlari uchun (Cyber Range target ilovalari)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip siqish (Tezlikni oshirish uchun)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Statik fayllar keshlanishi
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Asosiy sahifa va yo'nalishlar
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proksi (NestJS backend uchun, agar ishlatilsa)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
