<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAuth — Enterprise 2FA Gateway</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #030712;
            --card: #111827;
            --border: #1f2937;
            --text: #f9fafb;
            --muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center; }
        .brand { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .brand span { color: var(--primary); }
        .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
        .code-input { font-family: monospace; font-size: 24px; letter-spacing: 8px; text-align: center; width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; margin-bottom: 16px; }
        .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .flag { margin-top: 18px; padding: 14px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981; font-weight: bold; border-radius: 8px; font-size: 13px; display: none; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">🔒 Secure<span>Auth</span> SSO</div>
        <div class="subtitle">Ikki bosqichli tasdiqlash (2FA Verification)</div>

        <p style="font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.6;">
            Admin hisobiga kirish uchun 4 xonali SMS kodni kiriting. Tizimda so'rovlar chegarasi (Rate Limiting) o'rnatilmagan yoki kod <code>2026</code> ga teng.
        </p>

        <input type="text" id="twoFaCode" class="code-input" maxlength="4" placeholder="0000" />
        <button class="btn" onclick="verify2FA()">Kodni Tasdiqlash</button>

        <div id="flagBox" class="flag"></div>
    </div>

    <script>
        function verify2FA() {
            const code = document.getElementById('twoFaCode').value.trim();
            const flagBox = document.getElementById('flagBox');

            if (code === '2026' || code === '9942') {
                const flag = "FLAG{auth_bypass_2fa_response_tampering_3389}";
                flagBox.style.display = 'block';
                flagBox.innerHTML = `🎉 2FA Autentifikatsiyasi Chetlab O'tildi!<br>Boshqaruv flagi: <strong>${flag}</strong>`;

                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'lab_evidence',
                        labId: 'auth-bypass-secureauth',
                        evidence: {
                            type: '2fa_bypass_success',
                            code: code,
                            flag: flag,
                            timestamp: new Date().toISOString()
                        }
                    }, '*');
                }
            } else {
                alert("Xatolik: Noto'g'ri 2FA kod. To'g'ri kod: 2026");
                flagBox.style.display = 'none';
            }
        }
    </script>
</body>
</html>
