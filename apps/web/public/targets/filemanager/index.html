<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileManager — Internal Cloud File Browser</title>
    <style>
        :root {
            --primary: #0284c7;
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
        .brand { font-size: 20px; font-weight: 800; color: #fff; }
        .brand span { color: var(--primary); }
        .path-bar { display: flex; gap: 8px; background: #0b1120; border: 1px solid var(--border); padding: 8px; border-radius: 8px; margin-bottom: 20px; }
        .path-bar input { background: transparent; border: none; color: #38bdf8; font-family: monospace; font-size: 13px; width: 100%; outline: none; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .file-item { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer; text-align: center; }
        .file-item:hover { border-color: var(--primary); }
        .viewer { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 12px; color: #94a3b8; min-height: 160px; white-space: pre-wrap; }
        .flag { margin-top: 14px; padding: 12px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); font-weight: bold; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">📁 File<span>Manager</span> Enterprise Storage</div>
        <div style="font-size: 11px; background: #334155; padding: 4px 8px; border-radius: 4px; color: #38bdf8;">
            Path Traversal / LFI Laboratory
        </div>
    </div>

    <div class="path-bar">
        <span style="color: var(--muted); font-family: monospace;">path=/var/www/uploads/</span>
        <input type="text" id="pathInput" value="welcome.txt" />
        <button class="btn" onclick="loadFile()">Faylni Ochish</button>
    </div>

    <div class="file-grid">
        <div class="file-item" onclick="setPath('welcome.txt')">📄 welcome.txt</div>
        <div class="file-item" onclick="setPath('readme.md')">📄 readme.md</div>
        <div class="file-item" onclick="setPath('changelog.log')">📄 changelog.log</div>
    </div>

    <h4 style="font-size: 14px; margin-bottom: 8px;">Fayl Tarkibi (File Contents):</h4>
    <div id="fileContent" class="viewer">Yuklanmoqda...</div>
    <div id="flagContainer" class="flag"></div>

    <script>
        const sampleFiles = {
            "welcome.txt": "Xush kelibsiz! Bu korporativ fayl saqlash serveri.\nFaqat ruxsat berilgan fayllarni yuklashingiz mumkin.",
            "readme.md": "# Readme\nFayllar /var/www/uploads/ papkasida saqlanadi.",
            "changelog.log": "2026-09-20: Security patch v1.2 applied.\n2026-08-10: Base system installed."
        };

        function setPath(p) {
            document.getElementById('pathInput').value = p;
            loadFile();
        }

        function loadFile() {
            const path = document.getElementById('pathInput').value.trim();
            const viewer = document.getElementById('fileContent');
            const flagBox = document.getElementById('flagContainer');

            if (sampleFiles[path]) {
                viewer.innerText = sampleFiles[path];
                flagBox.style.display = 'none';
            } else if (path.includes('../') || path.includes('..\\')) {
                if (path.includes('passwd')) {
                    const flag = "FLAG{path_traversal_lfi_root_access_1120}";
                    viewer.innerText = `root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin\nflag:${flag}`;
                    flagBox.style.display = 'block';
                    flagBox.innerHTML = `🚨 Path Traversal Muvaffaqiyatli! /etc/passwd fayli o'qildi.<br>Flag: <strong>${flag}</strong>`;

                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'lab_evidence',
                            labId: 'path-traversal-filemanager',
                            evidence: {
                                type: 'path_traversal_file_leak',
                                payload: path,
                                flag: flag,
                                timestamp: new Date().toISOString()
                            }
                        }, '*');
                    }
                } else {
                    viewer.innerText = `[Directory Listing /etc/]\nhosts\nhostname\nshadow (Permission denied)\npasswd (Readable)\nissue`;
                    flagBox.style.display = 'none';
                }
            } else {
                viewer.innerText = `Xatolik: '${path}' fayli topilmadi.`;
                flagBox.style.display = 'none';
            }
        }

        loadFile();
    </script>
</body>
</html>
