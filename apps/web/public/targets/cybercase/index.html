<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCase — Digital Forensics & Incident Response Platform</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg: #090d16;
            --card: #111827;
            --border: #1f2937;
            --text: #f9fafb;
            --muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; }
        body { background: var(--bg); color: var(--text); padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
        .brand { font-size: 18px; font-weight: bold; color: #fff; }
        .brand span { color: var(--primary); }
        .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .log-table th { background: #000; padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; color: var(--muted); }
        .log-table td { padding: 10px; border-bottom: 1px solid var(--border); }
        .btn { background: var(--primary); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .flag { margin-top: 14px; padding: 12px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981; font-weight: bold; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">🔍 Cyber<span>Case</span> DFIR Lab (#CASE-2026-99)</div>
        <div style="font-size: 11px; background: rgba(245, 158, 11, 0.15); border: 1px solid var(--primary); color: var(--primary); padding: 3px 8px; border-radius: 4px;">
            Memory & Packet Analysis
        </div>
    </div>

    <div class="box">
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <input type="text" id="logFilter" placeholder="Filtr (masalan: C2, powershell, 185.220...)" style="flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 6px; outline: none;" />
            <button class="btn" onclick="filterLogs()">Filtrlash</button>
        </div>

        <table class="log-table">
            <thead>
                <tr>
                    <th>Vaqt</th>
                    <th>Manba IP</th>
                    <th>Protokol</th>
                    <th>Hodisa / Payload</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <!-- Populated by JS -->
            </tbody>
        </table>

        <div id="flagBox" class="flag"></div>
    </div>

    <script>
        const logs = [
            { time: "14:22:01", ip: "192.168.1.45", proto: "DNS", msg: "Standard query A api.cybertrip.uz" },
            { time: "14:22:15", ip: "192.168.1.45", proto: "HTTP", msg: "GET /index.html (Status: 200)" },
            { time: "14:23:44", ip: "185.220.101.5", proto: "TCP/4444", msg: "Reverse Shell Established: powershell -enc JABmAGwAYQBnAD0AJwBG... C2 Beacon Detected" },
            { time: "14:24:02", ip: "185.220.101.5", proto: "HTTP", msg: "Data Exfiltration: secret_credentials.dump" },
        ];

        function render(data) {
            const b = document.getElementById('logBody');
            b.innerHTML = data.map(l => `
                <tr>
                    <td style="color: var(--muted);">${l.time}</td>
                    <td style="color: #38bdf8;">${l.ip}</td>
                    <td style="color: #a855f7;">${l.proto}</td>
                    <td>${l.msg}</td>
                </tr>
            `).join('');
        }

        function filterLogs() {
            const q = document.getElementById('logFilter').value.toLowerCase().trim();
            const filtered = logs.filter(l => l.msg.toLowerCase().includes(q) || l.ip.includes(q) || l.proto.toLowerCase().includes(q));
            render(filtered);

            const flagBox = document.getElementById('flagBox');
            if (q.includes('powershell') || q.includes('c2') || q.includes('185.220')) {
                const flag = "FLAG{forensics_memory_artifact_recovered_8820}";
                flagBox.style.display = 'block';
                flagBox.innerHTML = `🛡️ Forensic Artefakt Muvaffaqiyatli Aniqlashdi! C2 aloqasi va PowerShell shellcodi topildi.<br>Flag: <strong>${flag}</strong>`;

                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'lab_evidence',
                        labId: 'forensics-cybercase',
                        evidence: {
                            type: 'dfir_artifact_identified',
                            query: q,
                            flag: flag,
                            timestamp: new Date().toISOString()
                        }
                    }, '*');
                }
            } else {
                flagBox.style.display = 'none';
            }
        }

        render(logs);
    </script>
</body>
</html>
